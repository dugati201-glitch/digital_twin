# Shared Python logging configuration. Console output is collected by journald.
version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '%(asctime)s %(levelname)s %(name)s [%(process)d]: %(message)s'
    datefmt: '%Y-%m-%dT%H:%M:%S%z'
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
